version: '3.8'

services:
  frontend:
    container_name: kairos-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:delegated
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - php

  php:
    image: php:8.2-apache
    container_name: kairos-php
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=kairos_db
      - DB_USER=root
      - DB_PASS=rootpass
    command: >
      bash -c "mkdir -p /var/www/html/backend/uploads/evidencies && chmod 777 /var/www/html/backend/uploads/evidencies && docker-php-ext-install pdo pdo_mysql && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: kairos-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: kairos_db
    volumes:
      - ./database/kairos_db.sql:/docker-entrypoint-initdb.d/00_init.sql
      - ./database/migration_notificacions.sql:/docker-entrypoint-initdb.d/01_notificacions.sql
      - ./database/migration_alumnes.sql:/docker-entrypoint-initdb.d/02_alumnes.sql
      - ./database/migration_sectors.sql:/docker-entrypoint-initdb.d/03_sectors.sql
      - ./database/migration_historial_consumo.sql:/docker-entrypoint-initdb.d/04_historial.sql
      - ./database/migration_talleres_fecha.sql:/docker-entrypoint-initdb.d/05_talleres_fecha.sql
      - ./database/migration_sollicituds_fase2.sql:/docker-entrypoint-initdb.d/06_sollicituds_fase2.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
  frontend_node_modules:
